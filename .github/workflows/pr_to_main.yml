name: Pull Request to Branch Main

# Adapted (not copied) from a sibling Forge-based project's own pr_to_main.yml
# (DXStarter/.github/workflows/pr_to_main.yml) — that project is Windows-only, vcpkg-driven, and
# builds via MSBuild-discovered vcpkg + a single clang-cl preset pair. None of that applies here:
# no vcpkg anywhere (every dependency is vendored inside the ForgeSrc submodule), no MSBuild, and
# this template spans Windows + Linux across 8 presets (CMakePresets.json's own hostSystemName
# gating). No format_check job either — unlike DXStarter, this repo has no first-party C++ source
# of its own to clang-format: every Examples/* .cpp is an unmodified vendored copy, ForgeSrc itself
# is a submodule this template never edits, and the only source this repo actually owns is
# CMakeLists.txt/Makefile/*.cmake, none of which clang-format applies to.
#
# Three parallel jobs, not one-per-platform anymore now that Windows itself has two real toolchains:
# build-windows (msvc-dev/msvc-prod — the one toolchain proven to build this vendored tree with /W4
# /WX and zero suppressions, see Makefile's own DEFAULT_PRESET comment), build-windows-clang
# (clang-dev/clang-prod, its own separate job rather than extra sequential steps bolted onto
# build-windows — real parallel wall-clock time, and each job's own failure is immediately
# attributable to one toolchain, not muddied by sharing a job with the other), and build-linux
# (linux-gcc-dev/linux-gcc-prod, Makefile's own Linux default). windows-2025's own published tool
# manifest already lists LLVM/clang-cl, confirmed directly — no extra install step needed for
# build-windows-clang beyond what build-windows already has. linux-clang-dev/linux-clang-prod are
# real, working presets too but deliberately not covered here yet — a 4th job for those is a real,
# separate scope decision, not done here.
#
# Both Windows jobs pinned to windows-2025 specifically (not windows-2022, and not the floating
# windows-latest) — confirmed directly against actions/runner-images' own published manifests that
# windows-2025 ships the identical LLVM 20.1.8 and identical Visual Studio Enterprise 2022 edition
# windows-2022 does (same missing-toolset-component gap the "Install MSVC v142" step below already
# handles either way), so this wasn't a toolchain-version upgrade — it was a genuine, direct
# experiment against clang-cl's own "path too long" failure (see
# cmake/forge-toolchain-clang-cl.cmake's own header comment for the full investigation) once every
# other more targeted hypothesis (checkout path length, /Zi vs /Z7, LLVM version alone, tested
# locally via a real side-by-side LLVM 20.1.8 install) had been individually ruled out. build-linux
# stays on ubuntu-24.04 (pinned, not -latest, same reasoning: this workflow's own extra setup steps
# were verified against that exact image's published tool manifest, and "latest" drifting to a newer
# image could silently invalidate that verification, e.g. a different Windows SDK/VS toolset or
# apt package baseline).
#
# Both Windows jobs (build-windows, build-windows-clang) check out to a short custom path (D:\x, a
# fresh, unambiguous root of its own — not a subdirectory of D:\a, the runner's own reserved work
# root, sidestepping any question of colliding with its "_temp"/"_actions"/"_tool" bookkeeping dirs
# entirely) instead of actions/checkout@v4's own default
# ${{ runner.workspace }}/ForgeTemplate/ForgeTemplate (nested twice, ~34 chars) — a real, confirmed
# clang-cl hazard specifically (long total paths, see cmake/forge-toolchain-clang-cl.cmake's own
# header comment for the "path too long" failure this fixes), not applied to build-linux, which has
# no equivalent MAX_PATH-style limitation at this codebase's actual path depths (ext4's own PATH_MAX
# is 4096, never realistically hit here) — no reason to add the same complexity to a job that has no
# real problem to fix.
#
# Via a raw `git init`/`fetch`/`checkout` sequence, not actions/checkout@v4's own "path:" input —
# confirmed directly, the hard way, via a real CI failure: actions/checkout@v4 hard-rejects any "path:"
# that resolves outside its own default nested workspace ("Repository path 'D:\a' is not under
# 'D:\a\ForgeTemplate\ForgeTemplate'"), a real built-in restriction, not something toggleable via an
# input. The manual sequence mirrors exactly what actions/checkout@v4 does internally for a shallow,
# specific-commit checkout: init an empty repo, fetch just the exact commit under test
# (${{ github.sha }} — for pull_request events this is already the synthetic merge commit, matching
# actions/checkout@v4's own default behavior) at --depth 1, then check it out. `git init` (not `git
# clone`) specifically because it tolerates an already-existing target directory — irrelevant for a
# fresh D:\x root that nothing else on the runner ever touches, but a real property either way.
# Anonymous HTTPS clone (no token) — this repo is public, no auth needed for a plain fetch/checkout.
#
# Each Windows job sets "defaults.run.working-directory" to D:\x so every later plain "run:" step
# (which is unaffected by the custom checkout location, unlike the manual clone step itself) operates
# from the right place automatically — actions/cache@v4's own "path:" input is a different case again:
# it's a "uses:" action input, not a "run:" step, so it's never covered by defaults.run.working-
# directory either, and is instead resolved against the still-default $GITHUB_WORKSPACE regardless of
# where the actual checkout now lives — so its value is written as an explicit absolute D:\x\...
# path per job below rather than relying on any default.

on:
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    name: Build (Windows, msvc-dev / msvc-prod)
    runs-on: windows-2025
    defaults:
      run:
        working-directory: D:\x
    steps:
      # See this workflow's own header comment for why this is a manual git sequence rather than
      # actions/checkout@v4 (its own "path:" input can't escape its default nested workspace at all).
      # Explicit working-directory: D:\ overrides the job-level default (D:\x) for this one step only
      # — real, confirmed necessary: pwsh.exe itself needs to cd into its working directory as part of
      # process *launch*, before any script content runs, so starting it already inside D:\x fails
      # outright ("The directory name is invalid") since D:\x doesn't exist until this very step's own
      # `git init` creates it — a real chicken-and-egg problem, found via a real CI failure. D:\ itself
      # (the drive root) always exists, so pwsh can launch there regardless. Every later step keeps
      # using the job-level D:\x default correctly, since it exists by the time they run.
      - name: Checkout repository
        shell: pwsh
        working-directory: D:\
        run: |
          git init D:\x
          git -C D:\x remote add origin "https://github.com/${{ github.repository }}.git"
          git -C D:\x fetch --depth 1 origin ${{ github.sha }}
          git -C D:\x checkout FETCH_HEAD
          echo "DONE: checkout repository"

      # ForgeWiki is reference material only (never built, see root CMakeLists.txt) — skipped here
      # to save clone time. ForgeSrc needs a real, full checkout (globbed by every module's own
      # CMakeLists.txt), but not its full history — --depth 1 is enough for a CI build.
      - name: Init ForgeSrc submodule (shallow; ForgeWiki skipped, not needed to build)
        run: |
          git submodule update --init --depth 1 ForgeSrc
          echo "DONE: init ForgeSrc submodule"

      # Cache key includes ForgeSrc's own short SHA (not just a fixed version suffix) so bumping the
      # submodule forces a fresh Art.zip fetch+extract rather than risking a stale cached subset
      # against a newer Forge source tree — a deliberate choice to re-check on every ForgeSrc bump
      # even though most bumps won't actually change what Examples/* needs, since Art.zip itself is
      # a separate, independently-versioned distribution with no direct tie to ForgeSrc's own git
      # history otherwise.
      - name: Get ForgeSrc short SHA
        id: forgesrc-sha
        run: |
          $sha = git -C ForgeSrc rev-parse --short HEAD
          echo "sha=$sha" >> $env:GITHUB_OUTPUT
          echo "DONE: ForgeSrc short SHA is $sha"

      # Examples/01_Transformations needs a handful of real Forge art assets (skybox textures + a
      # font) that ForgeSrc never vendors itself (see build-agent.md gotcha #10) - upstream's own
      # real source is a ~1.75GB Art.zip covering every Unit_Tests example, never fetched
      # automatically anywhere in this template. Version suffix still bumped by hand on top of the
      # SHA whenever the wanted-file list below changes on its own (e.g. a *different* Examples/*
      # needs more assets, independent of any ForgeSrc bump) — same idea as
      # cmake/forge-shaders.cmake's own explicit file list.
      # path: is an absolute path (D:\x\ForgeSrc\Art), not the usual relative ForgeSrc/Art — this
      # action's own "path:" input resolves against $GITHUB_WORKSPACE, not a job's
      # defaults.run.working-directory (that default only covers "run:" shell steps), and
      # $GITHUB_WORKSPACE itself still points at the old default nested location even though the
      # actual checkout now lives at D:\x (see this workflow's own header comment for the full why).
      - name: Restore cached Forge Art assets
        id: cache-art
        uses: actions/cache@v4
        with:
          path: D:\x\ForgeSrc\Art
          key: forge-art-01_transformations-v1-${{ steps.forgesrc-sha.outputs.sha }}

      # Only runs on a genuine cache miss - full download + full extract (no selective-member
      # extraction; tar.exe's own zip support isn't reliable to depend on here, confirmed directly:
      # this repo's own dev machine resolves `tar` to Git for Windows' bundled GNU tar, which can't
      # read zip at all, and the runner's PATH ordering isn't guaranteed to favor the native bsdtar
      # instead - Expand-Archive has no such ambiguity, it's a real PowerShell built-in). Every run
      # after this one just restores the small extracted subset from cache above, no network at all.
      - name: Download Forge Art assets (cache miss only)
        if: steps.cache-art.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP "Art.zip"
          $tmp = Join-Path $env:RUNNER_TEMP "art-extract"
          Invoke-WebRequest -Uri "http://www.conffx.com/Art.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $tmp -Force

          New-Item -ItemType Directory -Force -Path ForgeSrc/Art/Textures/dds, ForgeSrc/Art/Fonts/TitilliumText | Out-Null
          Get-ChildItem -Path $tmp -Recurse -Filter "Skybox_*.tex" | Copy-Item -Destination ForgeSrc/Art/Textures/dds
          Get-ChildItem -Path $tmp -Recurse -Filter "TitilliumText-Bold.otf" | Copy-Item -Destination ForgeSrc/Art/Fonts/TitilliumText

          Remove-Item -Recurse -Force $tmp, $zipPath
          echo "DONE: download Forge Art assets"

      # Confirmed missing on the windows-2022 runner image, not assumed: its own published component
      # list (actions/runner-images Windows2022-Readme.md) lists
      # Microsoft.VisualStudio.Component.VC.14.29.16.11.ARM/ARM64 but not the .x86.x64 sibling
      # cmake/forge-toolchain-msvc.cmake actually requires (Common_3/Application/Config.h whitelists
      # exactly this one MSVC toolset, 14.29.x / VS2019 16.11 / _MSC_VER 1929). Windows SDKs the
      # toolchain file globs for (10.0.22621.0/10.0.26100.0) are already present on this image, so
      # only the compiler toolset itself needs adding.
      - name: Install MSVC v142 (14.29-16.11) x86/x64 build tools
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vswhere   = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath    = & $vswhere -latest -property installationPath
          & $installer modify --installPath "$vsPath" `
            --add Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64 `
            --quiet --norestart --nocache
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            throw "vs_installer modify failed with exit code $LASTEXITCODE"
          }

      # Confirmed missing too, same source — GNU Make doesn't appear anywhere in the image's own
      # tool manifest (Git for Windows/MSYS2 are present, but neither puts a make.exe on PATH by
      # default). Ninja (1.13.2) and CMake are already present, no install needed for those.
      - name: Install GNU Make
        shell: pwsh
        run: choco install make -y

      - name: Build (msvc-dev)
        shell: pwsh
        run: make build

      - name: Build (msvc-prod)
        shell: pwsh
        run: make release

  build-windows-clang:
    name: Build (Windows, clang-dev / clang-prod)
    # See this workflow's own header comment for why windows-2025, not windows-2022.
    runs-on: windows-2025
    defaults:
      run:
        working-directory: D:\x
    steps:
      # See build-windows' own step above (same job-level default vs. this step's own working-
      # directory: D:\ override) for why this needs a plain, always-existing D:\ to launch pwsh in.
      - name: Checkout repository
        shell: pwsh
        working-directory: D:\
        run: |
          git init D:\x
          git -C D:\x remote add origin "https://github.com/${{ github.repository }}.git"
          git -C D:\x fetch --depth 1 origin ${{ github.sha }}
          git -C D:\x checkout FETCH_HEAD
          echo "DONE: checkout repository"

      - name: Init ForgeSrc submodule (shallow; ForgeWiki skipped, not needed to build)
        run: |
          git submodule update --init --depth 1 ForgeSrc
          echo "DONE: init ForgeSrc submodule"

      - name: Get ForgeSrc short SHA
        id: forgesrc-sha
        run: |
          $sha = git -C ForgeSrc rev-parse --short HEAD
          echo "sha=$sha" >> $env:GITHUB_OUTPUT
          echo "DONE: ForgeSrc short SHA is $sha"

      # Own cache key ("-winclang" suffix), distinct from build-windows' own entry, for the same
      # reason build-linux's own key carries a "-linux" suffix: this job runs in parallel with
      # build-windows, and two jobs of the same PR run finishing around the same time could otherwise
      # both try to populate the identical key — the content itself (skybox textures + font) is
      # platform-agnostic and would be identical either way, this is purely about avoiding a
      # cache-write race, not a real content difference.
      # path: absolute (D:\x\ForgeSrc\Art) for the same reason as build-windows' own entry above —
      # actions/cache@v4's own "path:" input isn't affected by defaults.run.working-directory.
      - name: Restore cached Forge Art assets
        id: cache-art
        uses: actions/cache@v4
        with:
          path: D:\x\ForgeSrc\Art
          key: forge-art-01_transformations-v1-winclang-${{ steps.forgesrc-sha.outputs.sha }}

      - name: Download Forge Art assets (cache miss only)
        if: steps.cache-art.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP "Art.zip"
          $tmp = Join-Path $env:RUNNER_TEMP "art-extract"
          Invoke-WebRequest -Uri "http://www.conffx.com/Art.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $tmp -Force

          New-Item -ItemType Directory -Force -Path ForgeSrc/Art/Textures/dds, ForgeSrc/Art/Fonts/TitilliumText | Out-Null
          Get-ChildItem -Path $tmp -Recurse -Filter "Skybox_*.tex" | Copy-Item -Destination ForgeSrc/Art/Textures/dds
          Get-ChildItem -Path $tmp -Recurse -Filter "TitilliumText-Bold.otf" | Copy-Item -Destination ForgeSrc/Art/Fonts/TitilliumText

          Remove-Item -Recurse -Force $tmp, $zipPath
          echo "DONE: download Forge Art assets"

      # cmake/forge-toolchain-clang-cl.cmake still discovers/needs the real MSVC 14.29.x toolset dir
      # (clang-cl compiles against real MSVC headers/libs via -vctoolsdir, it doesn't replace them) —
      # same install requirement as build-windows' own msvc job, not specific to clang-cl itself.
      - name: Install MSVC v142 (14.29-16.11) x86/x64 build tools
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vswhere   = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath    = & $vswhere -latest -property installationPath
          & $installer modify --installPath "$vsPath" `
            --add Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64 `
            --quiet --norestart --nocache
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            throw "vs_installer modify failed with exit code $LASTEXITCODE"
          }

      - name: Install GNU Make
        shell: pwsh
        run: choco install make -y

      - name: Build (clang-dev)
        shell: pwsh
        run: make build PRESET=clang-dev

      - name: Build (clang-prod)
        shell: pwsh
        run: make release PRESET=clang-dev

  build-linux:
    name: Build (Linux, linux-gcc-dev / linux-gcc-prod)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init ForgeSrc submodule (shallow; ForgeWiki skipped, not needed to build)
        run: |
          git submodule update --init --depth 1 ForgeSrc
          echo "DONE: init ForgeSrc submodule"

      # gcc/g++/clang/make/cmake/ninja/pkg-config are all already present on ubuntu-24.04 (confirmed
      # against actions/runner-images Ubuntu2404-Readme.md). GTK3/X11/Xrandr/udev dev headers are
      # the one real gap — OS/CMakeLists.txt's own pkg_check_modules(gtk+-3.0/x11/xrandr) plus a
      # direct `-ludev` link need them, and none are vendored (real system libraries, matching
      # upstream's own SteamOS_CodeLite/OSBase.project). Same package set this template's own docs
      # already call out for a fresh WSL image.
      - name: Install OS module's system dependencies (GTK3/X11/Xrandr/udev)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxrandr-dev libudev-dev
          echo "DONE: install OS module's system dependencies"

      # libvulkan.so itself (the loader) — Examples/01_Transformations links it directly (see that
      # CMakeLists.txt's own if(UNIX) comment), and ForgeSrc's own vendored VulkanSDK/bin/Linux/ never
      # carries the loader itself, only glslangValidator + the validation layer (confirmed directly,
      # see build-agent.md). Real upstream SteamOS_CodeLite build links the same plain system
      # libvulkan.so, not a vendored copy.
      - name: Install Vulkan loader (libvulkan-dev) for Examples/01_Transformations
        run: |
          sudo apt-get install -y libvulkan-dev
          echo "DONE: install Vulkan loader"

      # Same real Forge art assets Examples/01_Transformations needs on Windows (skybox textures +
      # font, see the Windows job's own comment above for the full "why") — now needed here too since
      # this example builds on Linux/Vulkan as well (confirmed directly against upstream's own real
      # SteamOS_CodeLite/01_Transformations.project, and against every real desktop
      # PathStatement.*.txt inside Art.zip: Windows/SteamOS/MacOS all map RD_TEXTURES at the same
      # Art/Textures/dds/ path, no separate Linux-specific texture format needed). Separate cache key
      # ("-linux" suffix) from the Windows job's own entry, purely to avoid any cross-OS cache-write
      # race between two jobs of the same PR run finishing around the same time and both trying to
      # populate the same key — the content itself is platform-agnostic and would be identical either
      # way. unzip's own presence isn't assumed here; python3's stdlib zipfile module is already
      # confirmed present on every GitHub-hosted runner and needs no extra install, mirroring the
      # Windows job's own "prefer a built-in over a custom parsing script" choice (Expand-Archive
      # there, zipfile here — both real, built into their own platform's standard toolset).
      - name: Get ForgeSrc short SHA
        id: forgesrc-sha
        run: |
          sha=$(git -C ForgeSrc rev-parse --short HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "DONE: ForgeSrc short SHA is $sha"

      - name: Restore cached Forge Art assets
        id: cache-art
        uses: actions/cache@v4
        with:
          path: ForgeSrc/Art
          key: forge-art-01_transformations-v1-linux-${{ steps.forgesrc-sha.outputs.sha }}

      - name: Download Forge Art assets (cache miss only)
        if: steps.cache-art.outputs.cache-hit != 'true'
        run: |
          mkdir -p ForgeSrc/Art/Textures/dds ForgeSrc/Art/Fonts/TitilliumText
          python3 -c "
          import os, urllib.request, zipfile
          zip_path = os.path.join(os.environ['RUNNER_TEMP'], 'Art.zip')
          urllib.request.urlretrieve('http://www.conffx.com/Art.zip', zip_path)
          names = [
              'Art/Textures/dds/Skybox_right1.tex', 'Art/Textures/dds/Skybox_left2.tex',
              'Art/Textures/dds/Skybox_top3.tex', 'Art/Textures/dds/Skybox_bottom4.tex',
              'Art/Textures/dds/Skybox_front5.tex', 'Art/Textures/dds/Skybox_back6.tex',
              'Art/Fonts/TitilliumText/TitilliumText-Bold.otf',
          ]
          with zipfile.ZipFile(zip_path) as z:
              for n in names:
                  dest = os.path.join('ForgeSrc', n)
                  with z.open(n) as src, open(dest, 'wb') as out:
                      out.write(src.read())
          os.remove(zip_path)
          "
          echo "DONE: download Forge Art assets"

      - name: Build (linux-gcc-dev)
        run: make build

      - name: Build (linux-gcc-prod)
        run: make release
